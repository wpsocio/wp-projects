name: Prepare or publish release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Prepare or publish release
    if: github.repository == 'wpsocio/wp-projects'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACCESS_TOKEN_IR }}

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          enable-wireit-cache: true

      - name: Setup PHP
        run: "pnpm run setup:php"

      - name: Setup git user
        run: |
          git config user.name "${{ secrets.GIT_USER_NAME_IR }}"
          git config user.email "${{ secrets.GIT_USER_EMAIL_IR }}"

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.ACCESS_TOKEN_IR }}
          publish-script: pnpm release
          version-script: pnpm prep-release
          pr-title: Prepare for next release
          commit-message: Prepare for next release
          push-with-git-cli: true
